:root{--cream:#fff8e8;--ink:#49301d;--brown:#734525;--gold:#f6bd4b;--pink:#f3a89b;--green:#71834c;--line:#e9d8b9}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(#e9d8b952 1px,transparent 1px);background-size:18px 18px}.top{height:66px;border-bottom:1px solid var(--line);background:#fffaf0eF;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:3}.brand{font-weight:900;letter-spacing:-.5px;font-size:20px}.brand span{color:#c6774b}.status{font:12px 'DM Mono',monospace;color:#8d755c}.layout{max-width:1140px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:1fr 310px;gap:26px}.play{background:#fffaf0;border:1px solid var(--line);border-radius:24px;min-height:640px;padding:32px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;box-shadow:0 12px 35px #6a45200c}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:900;color:#a58a69}.count{font-size:clamp(38px,7vw,68px);font-weight:900;letter-spacing:-3px;margin:6px 0 0;line-height:1}.count-label{font-size:15px;color:#987d5e;margin:8px 0 0}.rate{font:12px 'DM Mono',monospace;color:#bb8c42;margin-top:10px}.heart-wrap{position:relative;margin:37px auto 20px}.heart{width:242px;height:242px;border:0;background:none;cursor:pointer;filter:drop-shadow(0 14px 12px #ed4d5a38);transition:transform .1s;touch-action:manipulation}.heart:hover{transform:scale(1.045) rotate(-2deg)}.heart:active{transform:scale(.94)}.heart svg{width:100%;height:100%;overflow:visible}.crumb{position:absolute;color:#b27637;font-weight:900;font-size:20px;pointer-events:none;animation:float .8s ease-out forwards}.crumb.spend{color:#dc5363}@keyframes float{to{transform:translateY(-85px);opacity:0}}.hint{font-size:13px;color:#a38b6e;margin:6px 0 28px}.stats{width:100%;margin-top:auto;border-top:1px solid var(--line);padding-top:19px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:#a38b6e;text-transform:uppercase;letter-spacing:1px;font-weight:800}.side{display:flex;flex-direction:column;gap:14px}.card{background:#fffaf0;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 8px 22px #6a45200a}.card-title{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:900;margin-bottom:14px}.badge{font:10px 'DM Mono',monospace;background:#f5ebd8;padding:5px 8px;border-radius:7px;color:#927650}.shop-item{width:100%;border:1px solid #eee1ca;border-radius:13px;background:#fffdf7;padding:12px;display:grid;grid-template-columns:43px 1fr auto;gap:10px;align-items:center;text-align:left;color:var(--ink);cursor:pointer;margin-top:8px;transition:.15s;font:inherit}.shop-item:hover:not(:disabled){border-color:#d7ab61;transform:translateY(-1px);background:#fff8e9}.shop-item:disabled{opacity:.48;cursor:not-allowed}.icon{width:42px;height:42px;border-radius:12px;background:#f8edd8;display:grid;place-items:center;font-size:23px}.item-name{font-size:13px;font-weight:900}.item-desc{font-size:10px;color:#a38b6e;margin-top:2px}.price{font:11px 'DM Mono',monospace;color:#ad7a31;text-align:right;white-space:nowrap}.price small{display:block;color:#9c896f;margin-top:4px}.empty{font-size:12px;color:#a38b6e;line-height:1.5;padding:8px 0}.achievement{display:flex;gap:10px;align-items:center;font-size:12px}.medal{height:34px;width:34px;background:#f8e9c9;border-radius:50%;display:grid;place-items:center;font-size:17px}.achievement b{display:block}.achievement small{color:#a38b6e}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#49301d;color:white;padding:12px 18px;border-radius:12px;font-weight:800;font-size:13px;transition:.25s;z-index:5;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.reset{margin:0 auto 20px;border:none;background:none;color:#b6a28a;font:11px 'DM Mono',monospace;text-decoration:underline;cursor:pointer}.golden{position:absolute;top:25%;right:16%;border:0;background:none;font-size:52px;cursor:pointer;filter:drop-shadow(0 4px 7px #dda50066);animation:bob 1s infinite alternate;z-index:2}@keyframes bob{to{transform:translateY(-10px) rotate(12deg)}}@media(max-width:800px){.layout{grid-template-columns:1fr;margin:16px auto}.play{min-height:590px;padding:26px 18px}.side{display:grid;grid-template-columns:1fr 1fr}.side .card:first-child{grid-column:1/-1}.heart{width:210px;height:210px}}@media(max-width:490px){.side{display:flex}.top{padding:0 18px}.status{font-size:10px}.layout{padding:0 12px}.count{letter-spacing:-2px}}

<script>
(()=>{const items=[{id:'cursor',name:'Helpful cupid',desc:'A little click while you rest · +1 / 10 sec',icon:'👆',base:50,rate:0.1},{id:'grandma',name:'Heart grandma',desc:'Sends love · +1 / sec',icon:'👵',base:500,rate:1},{id:'oven',name:'Love potion',desc:'Keeps love flowing · +10 / sec',icon:'🔥',base:5000,rate:10},{id:'farm',name:'Heart garden',desc:'Hearts grow here · +100 / sec',icon:'🌱',base:50000,rate:100}];let s;try{s=JSON.parse(localStorage.getItem('littleBakerySave'))}catch{};s=s||{hearts:0,baked:0,best:0,owned:{}};s.hearts??=s.cookies??0;for(const i of items)s.owned[i.id]||=0;let toastTimer;const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString(),whole=n=>Math.floor(n).toLocaleString(),rate=()=>items.reduce((a,i)=>a+(s.owned[i.id]||0)*i.rate,0),price=i=>Math.floor(i.base*Math.pow(1.15,s.owned[i.id]||0));function save(){localStorage.setItem('littleBakerySave',JSON.stringify(s))}function notify(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100)}function render(){const r=rate();$('count').textContent=fmt(s.hearts);$('rate').textContent=r>0&&r<1?`+${fmt(r*10)} hearts / 10 seconds`:`+${fmt(r)} hearts / second`;$('baked').textContent=fmt(s.baked);$('best').textContent=fmt(s.best);const total=items.reduce((a,i)=>a+s.owned[i.id],0);$('buildings').textContent=fmt(total);$('owned').textContent=`${total} helper${total===1?'':'s'}`;$('shop').innerHTML=items.map(i=>{let p=price(i),n=s.owned[i.id]||0;return `<button class="shop-item" data-buy="${i.id}" ${s.hearts<p?'disabled':''}><span class="icon">${i.icon}</span><span><span class="item-name">${i.name} <span style="color:#ba9a6c">×${n}</span></span><span class="item-desc">${i.desc}</span></span><span class="price">❤️ ${fmt(p)}<small>buy one</small></span></button>`}).join('');const ms=[['First love',s.baked>=10,'Collect 10 hearts'],['Feeling the love',s.baked>=100,'Collect 100 hearts'],['The neighborhood',items.reduce((a,i)=>a+s.owned[i.id],0)>=10,'Gather 10 helpers'],['Heart tycoon',s.baked>=10000,'Collect 10,000 hearts']];const done=ms.filter(m=>m[1]).length;$('milestone-count').textContent=`${done} / ${ms.length}`;$('milestones').innerHTML=ms.map(([name,ok,desc])=>`<div class="achievement" style="opacity:${ok?1:.48};margin:10px 0"><span class="medal">${ok?'🏅':'○'}</span><span><b>${name}</b><small>${desc}</small></span></div>`).join('');save()}function earn(n,x,y){s.hearts+=n;s.baked+=n;s.best=Math.max(s.best,s.hearts);if(x!==undefined){const b=document.createElement('span');b.className='crumb';b.textContent=`+${fmt(n)}`;b.style.left=`${x}px`;b.style.top=`${y}px`;$('play').appendChild(b);setTimeout(()=>b.remove(),850)}render()}$('heart').addEventListener('click',e=>earn(1,e.clientX-$('play').getBoundingClientRect().left,e.clientY-$('play').getBoundingClientRect().top));$('shop').addEventListener('click',e=>{const b=e.target.closest('[data-buy]');if(!b)return;const i=items.find(i=>i.id===b.dataset.buy),p=price(i);if(s.hearts<p)return;s.hearts=Math.max(0,s.hearts-p);s.owned[i.id]++;const spent=document.createElement('span');spent.className='crumb spend';spent.textContent=`−${fmt(p)}`;spent.style.left='50%';spent.style.top='45%';$('play').appendChild(spent);setTimeout(()=>spent.remove(),850);notify(`−${fmt(p)} hearts · ${i.name} hired`);render()});$('reset').addEventListener('click',()=>{if(confirm('Start over with an empty jar? Your love shop save will be erased.')){s={hearts:0,baked:0,best:0,owned:Object.fromEntries(items.map(i=>[i.id,0]))};render();notify('A fresh start!')}});setInterval(()=>{let r=rate();if(r)earn(r/10)},100);render();})();
</script></body></html>
